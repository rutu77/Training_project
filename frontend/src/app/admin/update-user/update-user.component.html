<form [formGroup]="updateUserForm" (ngSubmit)="onSubmit()">

    <div class="p-fluid">

      <div class="p-field">
        <label for="role">Role</label>
        <p-select id="role" [options]="roles" formControlName="role" placeholder="Select a Role"></p-select>
      </div>
  
      <div class="p-dialog-footer">
        <button pButton type="submit">Update</button>
      </div>

    </div>

</form>
