<section class="mb-4" *ngIf="teacherRequests.length">
  <h2>Teacher access requests</h2>
  <div class="surface-card p-3 mb-2 border-round" *ngFor="let request of teacherRequests">
    <span>{{ request.name }} ({{ request.email }})</span>
    <button pButton type="button" class="ml-3"
      (click)="reviewTeacherRequest(request.id, 'approved')">Approve</button>
    <button pButton type="button" class="p-button-secondary ml-2"
      (click)="reviewTeacherRequest(request.id, 'rejected')">Reject</button>
  </div>
</section>

<app-generic-list 
  [items]="users"
  [heading]="'Manage users'"
  [description]="'View and update registered accounts.'"
  [emptyMessage]="'No user accounts are available.'"
  [itemFields]="['id', 'name', 'email', 'role']"
  [itemLabels]="['Id', 'Name', 'Email', 'Role']"
  [isLoading]="isLoading"
  [loadError]="loadError"
  [isUser]="true"
  (retryLoad)="loadUsers()"
  (updateItem)="onOpenUpdate($event)"
  (deleteItem)="deleteUser($event)">
</app-generic-list>



<p-dialog header="Update Item" [(visible)]="displayUpdateDialog" [modal]="true">
  <app-update-user [userId]="selectedUserId" (userUpdated)="refresh()"></app-update-user>
</p-dialog>
