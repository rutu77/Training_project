 
<app-generic-list 
[items]="courses"
[heading]="'Manage courses'"
[description]="'Published courses and unpublished drafts you own.'"
[emptyMessage]="'No courses have been created for this account yet.'"
[itemFields]="['id','title','isPublished','description','price','level','duration']"
[itemLabels]="['Id','Title','Publication status','Description','Price','Level','Duration']"
[isLoading]="isLoading"
[loadError]="loadError"
(retryLoad)="loadCourses()"
(addItem)="onOpenAdd()"
(updateItem)="onOpenUpdate($event)"
(deleteItem)="deleteCourse($event)"
>

  <!-- <ng-container add-form>
    <app-add-course (courseAdded)="refresh()"></app-add-course>
  </ng-container> -->


</app-generic-list>

<p-dialog header="add Course" [(visible)]="displayAddDialog" [modal]="true">
  <app-add-course (courseAdded)="refresh()"></app-add-course>
</p-dialog>


<p-dialog header="Update Course" [(visible)]="displayUpdateDialog" [modal]="true">
  <app-update-course [courseId]="selectCourseId" (courseUpdated)="refresh()"></app-update-course>
</p-dialog>
