<form class="update-lesson-form" [formGroup]="updateLessonForm" (ngSubmit)="onSubmit()">
  <p *ngIf="isLoadingLesson" class="field-hint" role="status">Loading lesson details…</p>

  <label for="update-lesson-title">Lesson title</label>
  <input id="update-lesson-title" formControlName="title" type="text" required>
  <small *ngIf="updateLessonForm.controls['title'].touched && updateLessonForm.controls['title'].invalid" class="field-error">
    Enter a lesson title.
  </small>

  <label for="update-lesson-video">Video URL <span class="optional-label">Optional</span></label>
  <input id="update-lesson-video" formControlName="videoUrl" type="url">

  <label for="update-lesson-duration">Duration <span class="optional-label">Minutes</span></label>
  <input id="update-lesson-duration" formControlName="duration" type="number" min="0" step="1" required>
  <small *ngIf="updateLessonForm.controls['duration'].touched && updateLessonForm.controls['duration'].invalid" class="field-error">
    Duration must be zero or more.
  </small>

  <button class="primary-action" type="submit"
    [disabled]="updateLessonForm.invalid || isSaving || isLoadingLesson">
    {{ isSaving ? 'Saving…' : 'Save changes' }}
  </button>
</form>
