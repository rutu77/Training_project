<section class="management-surface">
  <div class="list-toolbar">
    <div>
      <h1>{{ heading }}</h1>
      <p>{{ description }}</p>
    </div>
    <button *ngIf="!isUser" pButton type="button" class="list-add-button" (click)="openAddDialog()">
      <span class="pi pi-plus" aria-hidden="true"></span> Add new
    </button>
  </div>

  <label class="list-search">
    <span class="pi pi-search" aria-hidden="true"></span>
    <input type="search" pInputText placeholder="Search records…" [(ngModel)]="searchText" (input)="filterItems()">
  </label>

  <div *ngIf="!isLoading && loadError" class="list-empty" role="alert">
    <span>{{ loadError }}</span>
    <button pButton type="button" class="row-edit" (click)="retryLoad.emit()">Try again</button>
  </div>

  <div class="table-scroll" *ngIf="!isLoading && !loadError">
    <table aria-label="Managed records">
      <thead>
        <tr>
          <th *ngFor="let label of itemLabels" scope="col">{{ label }}</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of filteredItems">
          <td *ngFor="let field of itemFields">{{ getDisplayValue(item, field) }}</td>
          <td class="row-actions">
            <button pButton type="button" class="row-edit" (click)="openUpdateDialog(getFieldValue(item, 'id'))">
              <span class="pi pi-pencil" aria-hidden="true"></span> Edit
            </button>
            <button pButton type="button" class="row-delete" (click)="confirmDelete(getFieldValue(item, 'id'))">
              <span class="pi pi-trash" aria-hidden="true"></span> Delete
            </button>
          </td>
        </tr>
        <tr *ngIf="filteredItems.length === 0">
          <td class="list-empty-cell" [attr.colspan]="itemLabels.length + 1">
            {{ items.length > 0 ? 'No records match your search.' : emptyMessage }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="isLoading" class="list-empty" role="status">
    <p-progress-spinner></p-progress-spinner>
    <span>Loading records…</span>
  </div>
</section>
