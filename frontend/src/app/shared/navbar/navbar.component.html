<nav class="navbar" aria-label="Main navigation">
  <a routerLink="/home" class="brand">
    <span class="brand-mark">EC</span>
    <span>Edu<span class="brand-accent">Connect</span></span>
  </a>

  <div *ngIf="isLoggedIn" class="nav-content">
    <label class="search-wrap">
      <input type="search" pInputText aria-label="Search courses" placeholder="Search courses…"
        [(ngModel)]="searchValue" (ngModelChange)="searchCourses($event)">
    </label>
    <a *ngIf="!isTeacher && !isAdmin" routerLink="/quiz/progress" class="nav-link">Your progress</a>
    <div *ngIf="isTeacher || isAdmin" class="nav-dropdown">
      <button pButton type="button" class="nav-button" (click)="toggleCourseDropdown()">Teaching</button>
      <div class="dropdown-content" *ngIf="courseDropdownOpen">
        <a routerLink="/course/courselist" class="dropdown-link">Manage courses</a>
        <a routerLink="/course/lessonlist" class="dropdown-link">Manage lessons</a>
        <a routerLink="/quiz/managequiz" class="dropdown-link">Manage quizzes</a>
      </div>
    </div>
    <div *ngIf="isAdmin || isTeacher" class="nav-dropdown">
      <button pButton type="button" class="nav-button" (click)="toggleUserDropdown()">Administration</button>
      <div class="dropdown-content" *ngIf="userDropdownOpen">
        <a routerLink="/quiz/user-progress" class="dropdown-link">Learner progress</a>
        <a routerLink="/admin/user-enrollments" class="dropdown-link">Enrollments</a>
        <ng-container *ngIf="isAdmin">
          <a routerLink="/admin/userList" class="dropdown-link">Manage users</a>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="nav-actions">
    <div *ngIf="isLoggedIn; else guestActions" class="nav-dropdown">
      <button pButton type="button" class="profile-button" (click)="toggleProfileDropdown()">
        <span class="profile-avatar pi pi-user" aria-hidden="true"></span> Account
      </button>
      <div class="dropdown-content dropdown-right" *ngIf="profileDropdownOpen">
        <a routerLink="/home/profile" class="dropdown-link">My profile</a>
        <a routerLink="/home/mylearnings" class="dropdown-link">My learning</a>
        <button type="button" class="dropdown-link dropdown-logout" (click)="logout()">Sign out</button>
      </div>
    </div>
    <ng-template #guestActions>
      <a pButton routerLink="/auth/login" class="login-link">Log in</a>
      <a pButton routerLink="/auth/register" class="register-link">Get started</a>
    </ng-template>
  </div>
</nav>
